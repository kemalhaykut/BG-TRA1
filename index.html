<style>

.lib{display:grid;grid-template-columns:400px 1fr;gap:58px;max-width:1250px;margin:0 auto;align-items:start}
.cover{background:#2e4034;border-radius:6px 14px 14px 6px;padding:52px 46px;color:#f2ead2;min-height:680px;box-shadow:0 26px 55px rgba(0,0,0,.5),inset 7px 0 0 rgba(0,0,0,.28),inset -1px 0 0 rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;text-align:center}

.lede{font-size:13.5px;line-height:1.8;color:var(--ink2);max-width:560px;margin-bottom:22px}

.toc-row:hover{background:rgba(168,67,42,.05)}
.toc-row .num{font-family:'Playfair Display',serif;font-size:28px;color:var(--ink2);line-height:1;padding-top:4px;transition:.18s}
.toc-row:hover .num{color:var(--acc)}
.toc-row h3{font-family:'Playfair Display',serif;font-size:23px;font-weight:600}
.toc-row .ttr{font-style:italic;color:var(--ink2);font-size:13.5px;margin:2px 0 8px}
.toc-row .desc{font-size:13px;color:var(--ink2);line-height:1.7}
.toc-row .tags{font-size:10.5px;letter-spacing:.16em;color:var(--acc);margin-top:9px;text-transform:uppercase}
.toc-side{text-align:right;padding-top:8px}
.dots{display:flex;gap:5px;justify-content:flex-end}

.toc-side small{display:block;color:var(--ink2);font-size:11px;margin-top:7px;letter-spacing:.06em}
.toc-note{border-top:1px solid var(--edge);margin-top:4px;padding-top:18px;font-size:12px;color:var(--ink2);font-style:italic;line-height:1.8}
.story-top{max-width:1160px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;color:#efe6cf;gap:12px;flex-wrap:wrap}

.tr-sw{background:none;border:none;color:#efe6cf;opacity:.75;font-size:12.5px;letter-spacing:.08em;cursor:pointer;display:flex;align-items:center;gap:9px;padding:9px 4px}
.tr-sw:hover{opacity:1}.tr-sw.on{opacity:1;color:#f0c987}

.kick{font-size:10px;letter-spacing:.3em;color:var(--acc);text-transform:uppercase}
.s-title{font-family:'Playfair Display',serif;font-size:33px;font-weight:600;margin-top:10px}
.s-sub{font-style:italic;color:var(--ink2);font-size:14px;margin-top:3px}

.line{font-size:18.5px;line-height:1.6;margin-bottom:14px;position:relative;padding-right:34px}
.line:first-child{margin-top:2px}
.w{background:none;border:none;font:inherit;color:inherit;padding:0;cursor:pointer;border-radius:3px;transition:background .14s,color .14s}

.line .tr{display:none;font-style:italic;color:var(--ink2);font-size:14px;margin-top:4px;line-height:1.5}
.line.open .tr{display:block}
body.trall .line .tr{display:block}
body.trall .trb{display:none}
.trb{position:absolute;right:2px;top:4px;width:23px;height:23px;border:1px solid var(--edge);background:none;border-radius:50%;color:var(--ink2);cursor:pointer;opacity:0;transition:.15s;display:grid;place-items:center}
.line:hover .trb{opacity:1}
.trb:hover{color:var(--acc);border-color:var(--acc)}
.fn-area{border-top:1px dashed var(--edge);margin-top:6px;padding-top:13px;min-height:66px;display:flex;gap:10px;flex-wrap:wrap;align-content:flex-start}

.fn em{font-style:italic;color:var(--ink2);font-size:13px;margin-left:8px}

.fn .add{font-size:10px;color:var(--green);letter-spacing:.08em;margin-left:9px}
@keyframes leafOut{to{transform:rotateY(-96deg);opacity:.15}}
@keyframes leafIn{from{transform:rotateY(96deg);opacity:.15}to{transform:none;opacity:1}}
@keyframes fadeSlide{to{opacity:0;transform:translateX(-16px)}}
@keyframes fadeIn{from{opacity:0;transform:translateX(-16px)}}
.book.leaf-out .page.pr{transform-origin:left center;animation:leafOut .3s ease-in forwards}
.book.leaf-out .page.pl{animation:fadeSlide .3s ease-in forwards}
.book.leaf-in .page.pr{transform-origin:left center;animation:leafIn .36s ease-out}
.book.leaf-in .page.pl{animation:fadeIn .36s ease-out}
.book-nav{max-width:1160px;margin:20px auto 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}

.bn:hover:not(:disabled){background:#fff8e6;transform:translateY(-1px)}
.bn:disabled{opacity:.35;cursor:default}
.bn.ghost{background:transparent;color:#efe6cf;border:1px solid rgba(239,230,207,.35);box-shadow:none}
.bn.ghost:hover{background:rgba(239,230,207,.1)}
.bn.solid{background:var(--green);color:#f6efdd}
.bn.solid:hover:not(:disabled){background:#4c7050}
.hint{max-width:1160px;margin:14px auto 0;text-align:center;font-size:11px;color:rgba(239,230,207,.55);letter-spacing:.1em}
.end-pl{background:#2e4034;border-radius:9px 2px 2px 9px;color:#f2ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
.end-pl h2{font-family:'Playfair Display',serif;font-size:56px;font-weight:800;letter-spacing:.1em}

.end-pr{padding:52px 56px 44px;display:flex;flex-direction:column}
.end-pr h3{font-family:'Playfair Display',serif;font-size:26px;font-weight:600}
.end-pr .stats{font-size:13px;color:var(--ink2);font-style:italic;margin:8px 0 18px}
.focus-list{border-top:1px solid var(--edge);flex:1;overflow:auto;padding-top:8px}
.f-row{display:flex;align-items:baseline;gap:12px;padding:8px 2px;border-bottom:1px dotted #cdbf9c}
.f-row b{font-weight:500;font-size:17px;min-width:150px}
.f-row .lead{flex:1;border-bottom:1px dotted #cdbf9c;transform:translateY(-4px)}
.f-row span{font-style:italic;color:var(--ink2);font-size:14px}

.search:focus{border-bottom-color:var(--acc)}
.chip{border:1px solid var(--edge);background:transparent;color:var(--ink2);font-size:11.5px;padding:6px 13px;border-radius:999px;cursor:pointer;letter-spacing:.05em;transition:.15s}

.w-tools .bn{margin-left:auto}
.w-list{max-height:520px;overflow:auto;padding:10px 4px 4px}

.w-row .lead{flex:1;border-bottom:1px dotted #cdbf9c;transform:translateY(-4px)}

.w-row .cat{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);border:1px solid currentColor;padding:2.5px 9px;border-radius:999px;opacity:.8;flex:none}

.empty{padding:36px 10px;text-align:center;color:var(--ink2);font-style:italic;line-height:1.9;font-size:14px}

.q-card{padding:46px 60px 40px;text-align:center}

.q-word{font-family:'Playfair Display',serif;font-size:50px;font-weight:600;margin:34px 0 8px}
.q-cue{font-style:italic;color:var(--ink2);font-size:13px;margin-bottom:26px}
.q-opts{margin-top:10px;border-bottom:1px solid var(--edge)}
.q-opt{display:flex;width:100%;text-align:left;gap:15px;align-items:center;background:none;border:none;border-top:1px solid var(--edge);font:inherit;font-size:16.5px;padding:14px 8px;cursor:pointer;color:var(--ink);transition:.14s}
.q-opt:hover:not(:disabled){background:rgba(168,67,42,.05)}

.q-key{font-family:'Playfair Display',serif;border:1px solid var(--ink2);width:27px;height:27px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;flex:none}
.q-opt.ok{color:var(--green);font-weight:600}.q-opt.ok .q-key{background:var(--green);border-color:var(--green);color:#f6efdd}
.q-opt.bad{color:var(--acc)}.q-opt.bad .q-key{background:var(--acc);border-color:var(--acc);color:#f6efdd}
.q-next{margin-top:24px;min-height:44px}
.q-score{font-family:'Playfair Display',serif;font-size:46px;margin:26px 0 6px}
.q-score span{font-size:22px;color:var(--ink2)}
.q-msg{font-style:italic;color:var(--ink2);margin-bottom:26px;line-height:1.9}
@media (max-width:1150px){.lib{grid-template-columns:1fr}.book{flex-direction:column;max-width:660px}.page{width:100%;min-height:0}.p-illo{position:static;inset:auto;padding:40px 40px 30px}.illo-box{aspect-ratio:640/460}.p-text{position:static;inset:auto;padding:34px 40px 34px}.fn-area{min-height:52px}.words{padding:36px 30px}}
@media (max-width:700px){#view{padding:18px 14px 60px}#top{padding:12px 16px}.brand b{font-size:16px}.brand span{display:none}.cover{min-height:0;padding:40px 26px}.cover h1{font-size:34px}.toc{padding:30px 24px}.toc-row{grid-template-columns:40px 1fr;gap:12px;padding:18px 4px}.toc-row .num{font-size:22px}.toc-row h3{font-size:19px}.toc-side{display:none}.p-illo{padding:24px 22px 18px}.p-text{padding:26px 22px}.s-title{font-size:26px}.line{font-size:16.5px;margin-bottom:16px;padding-right:40px}.trb{width:30px;height:30px;opacity:.55}.q-card{padding:30px 24px}.q-word{font-size:36px}.words{padding:28px 20px}.w-row .bg{min-width:120px;font-size:16px}.bn{padding:12px 20px}}
</style>

{id:'s1',bg:'Нов ден',tr:'Yeni Bir Gün',tags:'Günlük rutin · Saatler · Yiyecekler',focus:['събужда','става','закуска','чака','работи','обича','пита','обед','благодаря','чете','вечерта','утре'],scenes:[
{l:'Мария е в София.|Maria Sofya’dadır.;Тя живее в малък апартамент.|O küçük bir dairede yaşar.;Слънцето е високо в небето.|Güneş gökyüzünde yüksektedir.;Часовникът е седем.|Saat yedidir.;Мария се събужда.|Maria uyanır.;„Добро утро!” — казва тя.|«Günaydın!» — der o.;Тя не е уморена.|O yorgun değildir.'},
{l:'Мария става от леглото.|Maria yataktan kalkar.;Тя отива в банята.|Banyoya gider.;Студената вода е добра за лицето.|Soğuk su yüz için iyidir.;След това тя облича синя рокля.|Sonra mavi bir elbise giyer.;Огледалото е голямо и чисто.|Ayna büyük ve temizdir.;Тя гледа в огледалото и се усмихва.|Aynaya bakar ve gülümser.;„Днес е понеделник.” — мисли тя.|«Bugün pazartesi.» — diye düşünür.'},
{l:'Мария отива в кухнята.|Maria mutfağa gider.;Тя иска закуска.|Kahvaltı ister.;На масата има хляб, сирене и мед.|Masada ekmek, peynir ve bal vardır.;Тя прави кафе.|Kahve yapar.;Кафето е много горещо.|Kahve çok sıcaktır.;Тя яде две филийки хляб със сирене.|Peynirli iki dilim ekmek yer.;„Хубаво е!” — казва Мария.|«Güzel!» — der Maria.'},
{l:'В осем часа Мария излиза от дома.|Sekizde Maria evden çıkar.;Улицата е тиха.|Sokak sessizdir.;Тя чака автобуса на спирката.|Durakta otobüsü bekler.;Автобусът е червен и голям.|Otobüs kırmızı ve büyüktür.;В автобуса има много хора.|Otobüste çok insan vardır.;Един мъж пита: „Вие сте Мария?”|Bir adam sorar: «Siz Maria misiniz?»;„Да, аз съм. Здравейте!”|«Evet, öyleyim. Merhaba!»'},
{l:'Мария работи в библиотека.|Maria bir kütüphanede çalışır.;Тя много обича книгите.|Kitapları çok sever.;Библиотеката е голяма и светла.|Kütüphane büyük ve aydınlıktır.;В нея има хиляди книги.|İçinde binlerce kitap vardır.;Мария чете и пише цял ден.|Maria bütün gün okur ve yazar.;Един ученик пита за една книга.|Bir öğrenci bir kitap hakkında sorar.;Мария помага на него с радост.|Maria ona sevinçle yardım eder.'},
{l:'На обед Мария отива в малко кафе.|Öğlen Maria küçük bir kafeye gider.;Тя седи на маса до прозореца.|Pencere kenarındaki masaya oturur.;Тя поръчва салата и вода.|Salata ve su sipariş eder.;Приятелят ѝ Иван идва.|Arkadaşı İvan gelir.;„Здравей, Мария! Как си?” — пита Иван.|«Merhaba Maria! Nasılsın?» — sorar İvan.;„Добре съм, благодаря!” — отговаря Мария.|«İyiyim, teşekkürler!» — cevaplar Maria.;Те говорят за живота и за книгите.|Hayattan ve kitaplardan konuşurlar.'},
{l:'Вечерта Мария е у дома.|Akşam Maria evdedir.;Тя седи до прозореца и гледа навън.|Pencerenin yanına oturur, dışarıyı seyreder.;Небето е тъмно и звездите са малки.|Gökyüzü karanlık, yıldızlar küçük.;Вятърът е лек и хладен.|Rüzgâr hafif ve serindir.;Тя чете любимата си книга в леглото.|Yatakta sevdiği kitabı okur.;След един час тя заспива.|Bir saat sonra uykuya dalar.;Утре отново е нов ден.|Yarın yine yeni bir gündür.'}]},
{id:'s2',bg:'Кучето Барни',tr:'Köpek Barney',tags:'Soru kalıpları · Renkler · Yerler',focus:['къде','тук','извинете','куче','парка','под','зад','към','край','тича','чува','моста'],scenes:[
{l:'Никола е малко момче от Пловдив.|Nikola, Plovdiv’li küçük bir çocuk.;Той има куче.|Onun bir köpeği var.;Кучето е кафяво и бяло.|Köpek kahverengi ve beyaz.;Името на кучето е Барни.|Köpeğin adı Barney.;Барни е добър приятел на Никола.|Barney, Nikola’nın iyi arkadaşı.;Всяка сутрин Никола дава храна на Барни.|Her sabah Nikola Barney’e yemek verir.;Барни маха с опашката си.|Barney kuyruğunu sallar.'},
{l:'Една сутрин Барни го няма в двора.|Bir sabah Barney avluda yok.;„Къде е Барни?” — пита Никола.|«Barney nerede?» — sorar Nikola.;Той гледа наляво и надясно.|Sola ve sağa bakar.;Кучето не е под дървото.|Köpek ağacın altında değil.;Не е и зад къщата.|Evin arkasında da değil.;Майка му е в кухнята.|Annesi mutfakta.;„Мамо, Барни го няма!” — казва Никола.|«Anne, Barney yok!» — der Nikola.'},
{l:'Никола излиза на улицата.|Nikola sokağa çıkar.;Съседката Петрова стои до портата.|Komşu Petrova kapının yanında durur.;„Добър ден!” — казва Никола.|«İyi günler!» — der Nikola.;„Видяхте ли кучето ми? То е кафяво и бяло.”|«Köpeğimi gördünüz mü? Kahverengi ve beyaz.»;„Не, не видях.” — казва Петрова.|«Hayır, görmedim.» — der Petrova.;„Питайте в парка.”|«Parkta sorun.»;„Там много хора ходят с кучета.”|«Oraya çok insan köpeğiyle gider.»'},
{l:'Никола тича в парка.|Nikola parkta koşar.;Децата играят на игрището.|Çocuklar oyun alanında oynar.;„Извинете!” — казва Никола.|«Affedersiniz!» — der Nikola.;„Тук ли е кафяво куче? То е малко.”|«Burada kahverengi köpek var mı? Küçük.»;Едно момиче казва: „Да!”|Bir kız der: «Evet!»;„Едно куче бяга към реката.”|«Bir köpek nehire doğru koşuyor.»;„Благодаря много!” — казва Никола и тича.|«Çok teşekkürler!» — der Nikola ve koşar.'},
{l:'Никола бърза към реката.|Nikola nehire doğru acele eder.;Той чува лаене.|Havlama duyar.;Зад дърветата стои едно куче.|Ağaçların arkasında bir köpek durur.;То е голямо и черно.|O büyük ve siyah.;„Това не е Барни.” — мисли Никола.|«Bu Barney değil.» — diye düşünür.;Той е тъжен и уморен.|O üzgün ve yorgun.;Той сяда на тревата край реката.|Nehir kıyısındaki çimene oturur.'},
{l:'Никола чува още лаене.|Nikola daha çok havlama duyar.;Гласът идва от моста.|Ses köprüden geliyor.;Под моста стои малко куче.|Köprünün altında küçük bir köpek.;То е кафяво и бяло!|O kahverengi ve beyaz!;„Барни!” — вика Никола силно.|«Barney!» — Nikola bağırdadır.;Кучето тича бързо към него.|Köpek hızla ona koşar.;Никола гали ушите му.|Nikola kulaklarını okşar.'},
{l:'Двамата се връщат у дома.|İkisi eve döner.;Майката стои на вратата.|Anne kapının önünde durur.;„Ето го Барни!” — казва Никола с усмивка.|«İşte Barney!» — der gülümseyerek.;Барни пие много вода.|Barney çok su içer.;След това той спи в кошарата.|Sonra kulübesinde uyur.;Никола дава на Барни кост.|Nikola Barney’e kemik verir.;Днес е много хубав ден.|Bugün çok güzel bir gün.'}]},
{id:'s3',bg:'Баба и пазарът',tr:'Büyükanne ve Çarşı',tags:'Sayılar · Alışveriş · Yiyecekler',focus:['събота','пазара','колко','лева','кило','взема','купуват','сирене','мед','диня','цветя','обяд'],scenes:[
{l:'Събота е.|Cumartesidir.;Баба Станка става рано.|Nine Stanka erken kalkar.;Нейната внучка Елица също става.|Torunu Elitsa da kalkar.;„Днес отиваме на пазара.” — казва баба.|«Bugün çarşıya gidiyoruz.» — der nine.;Елица е много радостна.|Elitsa çok sevinçli.;Тя облича жълтата си куртка.|Sarı ceketini giyer.;В осем часа двете излизат от дома.|Sekizde ikisi evden çıkar.'},
{l:'Пазарът е близо.|Çarşı yakındır.;Те минават по улицата.|Sokaktan geçerler.;По пътя има пекарна.|Yolda bir fırın var.;Мирише на топъл хляб.|Sıcak ekmek kokusu gelir.;„Искаш ли хляб?” — пита баба.|«Ekmek ister misin?» — sorar nine.;„Да, благодаря!” — казва Елица.|«Evet, teşekkürler!» — der Elitsa.;Те купуват две топли питки.|İki sıcak ekmek alırlar.'},
{l:'На пазара е оживено.|Çarşı hareketlidir.;Много хора купуват зеленчуци.|Çok insan sebze alır.;Домати — червени и големи.|Domatesler — kırmızı ve büyük.;„Колко струват доматите?” — пита баба.|«Domates ne kadar?» — sorar nine.;„Два лева за кило.” — отговаря човекът.|«Kilo başına iki lev.» — der adam.;Баба взема три килограма.|Nine üç kilo alır.;Елица брои: един, два, три…|Elitsa sayar: bir, iki, üç…'},
{l:'След това те отиват при плодовете.|Sonra meyvelere giderler.;Ябълките са зелени и сладки.|Elmalar yeşil ve tatlı.;Динята е голяма и тежка.|Karpuz büyük ve ağır.;Елица иска една диня.|Elitsa bir karpuz ister.;„Тази диня тежи пет килограма.” — казва продавачът.|«Bu karpuz beş kilo.» — der satıcı.;„Нямаме пари за нея.” — казва баба и се смее.|«Paramız yok.» — der nine ve güler.;Те вземат половин диня.|Yarım karpuz alırlar.'},
{l:'До тях има тезгях със сирене и мед.|Yanlarında peynir-bal tezgâhı var.;Сиренето е бяло като сняг.|Peynir kar gibi beyaz.;„Пробвайте!” — казва жената.|«Deneyin!» — der kadın.;Баба пробва малко парче.|Nine küçük parça dener.;„Много е вкусно!” — казва тя.|«Çok lezzetli!» — der o.;Елица също пробва сиренето и меда.|Elitsa da peyniri ve balı dener.;Те купуват едно кило сирене.|Bir kilo peynir alırlar.'},
{l:'Накрая Елица вижда цветя.|Sonunda Elitsa çiçek görür.;Червените рози са много красиви.|Kırmızı güller çok güzel.;„За кого са тези цветя?” — пита баба.|«Bu çiçekler kimin için?» — sorar nine.;„За теб, бабо!” — казва Елица.|«Senin için, nine!» — der Elitsa.;Баба е изненадана и много щастлива.|Nine şaşkın ve çok mutlu.;Тя прегръща внучката си.|Torununu kucaklar.;„Ти си мило дете.” — казва тя.|«Sen tatlı bir çocuksun.» — der o.'},
{l:'У дома баба прави обяд.|Evde nine öğle yemeği yapar.;На масата има салата, сирене и хляб.|Masada salata, peynir, ekmek var.;Елица носи чиниите.|Elitsa tabakları taşır.;Храната е много вкусна.|Yemek çok lezzetli.;След обяд те ядат диня в градината.|Sonra bahçede karpuz yerler.;Слънцето е топло, вятърът е лек.|Güneş ılık, rüzgâr hafif.;Съботата е хубав ден.|Cumartesi güzel bir gün.'}]},

{l:'Казвам се Стефан.|Adım Stefan.;Аз съм на десет години.|On yaşındayım.;Това е моето семейство.|Bu benim ailem.;В семейството има четири души.|Ailede dört kişi var.;Майка, баща, сестра и аз.|Anne, baba, kız kardeş ve ben.;Ние живеем в Пловдив.|Biz Plovdiv’de yaşarız.;Нашата къща е голяма.|Bizim evimiz büyük.'},
{l:'Моята майка е лекар.|Annem doktordur.;Тя работи в болница.|Hastanede çalışır.;Тя е умна и добра.|O akıllı ve iyi.;Майка ми готви много хубаво.|Annem çok güzel yemek yapar.;Вечерта тя чете книга.|Akşam kitap okur.;Аз я обичам много.|Ben onu çok severim.;Тя също ме обича.|O da beni sever.'},
{l:'Баща ми е учител.|Babam öğretmend.;Той работи в училище.|Okulda çalışır.;Той е висок и силен.|O uzun boylu ve güçlü.;Той обича футбол.|Futbolu sever.;В събота играем заедно.|Cumartesi birlikte oynarız.;Той е много весел.|O çok neşeli.;Баща ми е и добър приятел.|Babam iyi bir arkadaş.'},
{l:'Сестра ми е на шест години.|Kız kardeşim altı yaşında.;Тя е малка и весела.|O küçük ve neşeli.;Тя играе с кукли.|Oyuncak bebeklerle oynar.;Куклите са красиви.|Bebekler güzel.;Тя рисува всяка вечер.|Her akşam resim çizer.;Нейната стая е синя.|Onun odası mavi.;В стаята има играчки.|Odada oyuncaklar var.'},
{l:'Баба и дядо живеят в село.|Nine ve dede köyde yaşar.;Селото е малко и тихо.|Köy küçük ve sessiz.;Дядо има голяма градина.|Dedenin büyük bahçesi var.;В градината има ябълки и рози.|Bahçede elma ve gül var.;Баба прави вкусен хляб.|Nine lezzetli ekmek yapar.;Ние ходим при тях често.|Sık onlara gideriz.;Там е много спокойно.|Orası çok huzurlu.'},
{l:'Вечерта семейството е вкъщи.|Akşam aile evdedir.;Ние ядем заедно на масата.|Masada birlikte yeriz.;Майка ми готви супа.|Annem çorba yapar.;Баща ми носи хляб.|Babam ekmek getirir.;Говорим за деня.|Gün hakkında konuşuruz.;Смеем се заедно.|Birlikte güleriz.;Това е моят любим час.|En sevdiğim andır.'},
{l:'Моето семейство е хубаво.|Ailem güzeldir.;Ние сме щастливи.|Biz mutluyuz.;Заедно сме силни.|Birlikte güçlüyüz.;Аз много обичам моето семейство.|Ailemi çok severim.;В неделя ходим при баба.|Pazar nineye gideriz.;Семейството е мой дом.|Aile benim yuvam.;Голямо ли е твоето семейство?|Ailen büyük mü?'}]},
{id:'s5',bg:'Четири годишни времена',tr:'Dört Mevsim',tags:'Mevsimler · Hava durumu · Doğa',focus:['зима','вали','сняг','пролетта','дъжд','лятото','море','плуваме','есента','листата','сезон','година'],scenes:[

{l:'Пролетта идва след зимата.|İlkbahar kıştan sonra gelir.;Слънцето е топло.|Güneş ılık.;Цветята растат.|Çiçekler büyür.;Птиците пеят.|Kuşlar öter.;Небето е синьо.|Gökyüzü mavi.;Тревата е зелена.|Çimen yeşil.;Аз много обичам пролетта.|İlkbaharı çok severim.'},
{l:'През пролетта вали дъжд.|İlkbaharda yağmur yağar.;Дъждът е лек.|Yağmur hafif.;След дъжда има дъга.|Yağmurdan sonra gökkuşağı.;Дъгата е широка.|Gökkuşağı geniş.;Патиците плуват в езерото.|Ördekler gölde yüzer.;Всичко е зелено и живо.|Her şey yeşil ve canlı.;Пролетта е весела.|İlkbahar neşeli.'},

{l:'Зима, пролет, лято, есен.|Kış, ilkbahar, yaz, sonbahar.;Четири годишни времена.|Dört mevsim.;Всичките четири са красиви.|Dördü de güzel.;Всяка година идват отново.|Her yıl yeniden gelirler.;Моят любим сезон е лятото.|Sevdiğim mevsim yaz.;Обичам морето и слънцето.|Denizi ve güneşi severim.;А ти? Кой е твоят любим сезон?|Sen? Sevdiğin mevsim hangisi?'}]},

{l:'Ние отиваме на гарата.|İstasyona gideriz.;Гарата е голяма и шумна.|İstasyon büyük ve gürültülü.;Баща ми купува два билета.|Babam iki bilet alır.;„Колко струва билетът?” — питам аз.|«Bilet ne kadar?» — ben sorarım.;„Десет лева.” — отговаря човекът.|«On lev.» — adam cevap verir.;Чакаме влака.|Treni bekleriz.;Влакът закъснява малко.|Tren biraz gecikir.'},

{id:'s7',bg:'Вкусна вечеря',tr:'Lezzetli Akşam',tags:'Restoran · Yiyecek · Sipariş',focus:['петък','ресторант','менюто','риба','пиле','месо','десерт','сметката','плаща','бакшиш','връщаме','луната'],scenes:[
{l:'Днес е петък.|Bugün cuma.;Цялото семейство отива в ресторант.|Bütün aile restorana gider.;Ресторантът е в центъра на града.|Restoran şehir merkezinde.;Там е уютно.|Orası sıcak ve rahat.;Нашата маса е до прозореца.|Masamız pencere yanında.;Сестра ми седи до майка ми.|Kardeşim annemin yanında.;Ние сме гладни.|Biz açız.'},
{l:'Сервитьорът носи менюто.|Garson menüyü getirir.;Менюто е голямо.|Menü büyük.;Има супа, салата, риба и пиле.|Çorba, salata, balık, tavuk var.;Има и много десерти.|Çok tatlı da var.;Аз чета менюто.|Menüyü okuyorum.;Всичко изглежда вкусно.|Her şey lezzetli görünüyor.;Изборът е труден.|Seçim zor.'},
{l:'„Какво искате?” — пита сервитьорът.|«Ne istersiniz?» — garson sorar.;„Аз искам пилешка супа.” — казва майка ми.|«Tavuk çorbası.» — der annem.;Баща ми иска салата и риба.|Babam salata ve balık ister.;Сестра ми иска пиле с картофи.|Kardeşim patatesli tavuk ister.;Аз искам месо с ориз.|Ben et ve pirinç isterim.;И една минерална вода.|Ve bir maden suyu.;„Веднага!” — казва сервитьорът.|«Hemen!» — der garson.'},
{l:'Храната идва бързо.|Yemek çabuk gelir.;Супата е гореща.|Çorba sıcak.;Рибата е с лимон.|Balık limonlu.;Пилето е много меко.|Tavuk çok yumuşak.;Картофите са вкусни.|Patatesler lezzetli.;Всички ядем много.|Herkes çok yer.;„Приятен апетит!” — казва сервитьорът.|«Afiyet olsun!» — der garson.'},
{l:'След храната искаме десерт.|Yemekten sonra tatlı isteriz.;Сервитьорът носи сладолед и торта.|Garson dondurma ve pasta getirir.;Тортата е с шоколад.|Pasta çikolatalı.;Сестра ми яде две парчета.|Kardeşim iki parça yer.;Десертът е прекрасен.|Tatlı harika.;Баща ми пие кафе.|Babam kahve içer.;Аз пия сок.|Ben meyve suyu içerim.'},

{l:'Връщаме се у дома.|Eve döneriz.;Всички са доволни.|Herkes memnun.;Храната беше много вкусна.|Yemek çok lezzetliydi.;Сестра ми спи в колата.|Kardeşim arabada uyuyor.;Улицата е тиха и тъмна.|Sokak sessiz ve karanlık.;Луната свети над града.|Ay şehrin üstünde parlıyor.;Ще дойдем отново.|Yine geleceğiz.'}]},
{id:'s8',bg:'Рожденият ден на Ива',tr:'İva’nın Doğum Günü',tags:'Doğum günü · Sayılar · Renkler',focus:['рожден ден','балони','торта','свещи','подарък','приятелите','танцуват','криеница','желание','изгася','отваря','топка'],scenes:[
{l:'Днес Ива има рожден ден.|Bugün İva’nın doğum günü.;Ива е на седем години.|İva yedi yaşında.;Тя е много щастлива.|O çok mutlu.;В къщата има балони.|Evde balonlar var.;Балоните са червени, жълти и сини.|Balonlar kırmızı, sarı, mavi.;Майка ѝ прави торта.|Annesi pasta yapıyor.;Баща ѝ носи цветя.|Babası çiçek getiriyor.'},

{l:'Звънецът звъни.|Zil çalıyor.;Приятелите идват.|Arkadaşlar geliyor.;Мартин носи голям подарък.|Martin büyük hediye getiriyor.;Нина носи цветя.|Nina çiçek getiriyor.;„Честит рожден ден!” — казват те.|«Doğum günün kutlu!» — derler.;Ива ги прегръща.|İva onları kucaklar.;Всички влизат в стаята.|Herkes odaya giriyor.'},
{l:'Децата играят игри.|Çocuklar oyun oynar.;Те танцуват и пеят.|Dans ediyor, şarkı söylüyorlar.;Мартин е много весел.|Martin çok neşeli.;Нина танцува с Ива.|Nina İva ile dans ediyor.;Те се смеят много.|Çok gülerler.;После играят криеница.|Sonra saklambaç oynarlar.;Забавлението е голямо.|Eğlence büyük.'},
{l:'Майката носи тортата.|Anne pastayı getiriyor.;Всички пеят песента.|Herkes şarkıyı söylüyor.;Ива прави желание.|İva dilek tutuyor.;Тя изгася свещите.|Mumları üflüyor.;Всички ръкопляскат.|Herkes alkışlıyor.;Тортата е много вкусна.|Pasta çok lezzetli.;Всички искат по едно парче.|Herkes birer parça istiyor.'},
{l:'Сега Ива отваря подаръците.|Şimdi İva hediyeleri açıyor.;Първият подарък е от Мартин.|İlk hediye Martin’den.;В кутията има топка.|Kutuda top var.;Топката е червена и бяла.|Top kırmızı ve beyaz.;От Нина има книга с приказки.|Nina’dan masal kitabı var.;Ива е много щастлива.|İva çok mutlu.;„Благодаря, приятели!” — казва тя.|«Teşekkürler, arkadaşlar!» — der.'},
{l:'Вечерта приятелите си тръгват.|Akşam arkadaşlar gidiyor.;„Довиждане!” — казва Ива.|«Hoşça kalın!» — der İva.;Къщата е тиха.|Ev sessiz.;Ива гледа подаръците си.|İva hediyelerine bakıyor.;Тя е щастлива, но уморена.|Mutlu ama yorgun.;Това е най-хубавият рожден ден.|En güzel doğum günü.;Тя заспива с усмивка.|Gülümseyerek uyuyor.'}]},

{l:'Излизаме навън.|Dışarı çıkıyoruz.;Улицата е мокра.|Sokak ıslak.;Има големи локви.|Büyük birikintiler var.;Аз скачам в локвите.|Birikintlere atlıyorum.;Водата пръска навсякъде.|Su her yere sıçrıyor.;Чадърът пази от дъжда.|Şemsiye yağmurdan koruyor.;Мама и аз се смеем.|Annem ve ben gülüyoruz.'},
{l:'След обяд ми е студено.|Öğleden sonra üşüyorum.;Аз кихам.|Hapşırıyorum.;Кихам много пъти.|Çok kez hapşırıyorum.;Главата ми боли.|Başım ağrıyor.;Гърлото ми боли също.|Boğazım da ağrıyor.;Мама ме докосва по челото.|Annem alnıma dokunuyor.;„Ти имаш температура!” — казва тя.|«Ateşin var!» — der o.'},
{l:'Мама вика лекаря.|Annem doktoru çağırıyor.;Лекарят идва след час.|Doktor bir saat sonra gelir.;Той има сива чанта.|Onun gri çantası var.;„Здравей! Къде те боли?” — пита лекарят.|«Merhaba! Neren ağrıyor?» — sorar.;„Гърлото и главата.” — отговарям аз.|«Boğaz ve baş.» — derim.;Лекарят гледа гърлото ми.|Doktor boğazıma bakıyor.;„Имаш лека настинка.” — казва той.|«Hafif nezlen var.» — der.'},
{l:'Лекарят дава лекарство.|Doktor ilaç veriyor.;„Пий топъл чай.” — казва той.|«Ilık çay iç.» — der.;„И си легни рано.”|«Ve erken yat.»;„Скоро ще си здрав!”|«Yakında iyileşirsin!»;Мама дава на лекаря пари.|Annem doktora para veriyor.;„Благодаря, доктор!” — казва мама.|«Teşekkürler, doktor!» — der anne.;Лекарят тръгва в дъжда.|Doktor yağmura gidiyor.'},

's10-6':()=>sky('#f0e5c7')+sun(76,80,22)+gnd(336,'#b9c49a')+gnd(392,'#aebd8a')+R(140,170,360,180,'#f2ead4',6)+P('M 124 170 L 320 100 L 516 170 Z','#b0705a')+windowIn(180,210,60,54,'#dcead8')+windowIn(280,210,60,54,'#dcead8')+windowIn(380,210,60,54,'#dcead8')+R(280,260,80,90,'#7a5a38',4)+cr(430,200,13)+boy(140,418,.85)+bll(190,432,15,CREAM)+boy(240,418,.85,RED)+Pc('M 60 430 q 20 -14 40 0 M 560 434 q 20 -14 40 0',LG,3)};

const EMBLEM=(c='#f2ead2')=>`<svg viewBox="0 0 200 150" fill="none"><circle cx="100" cy="52" r="24" stroke="${c}" stroke-width="3"/><line x1="100" y1="12" x2="100" y2="24" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="66" y1="22" x2="74" y2="32" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="134" y1="22" x2="126" y2="32" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="56" y1="52" x2="68" y2="52" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="132" y1="52" x2="144" y2="52" stroke="${c}" stroke-width="3" stroke-linecap="round"/><path d="M 40 92 C 60 80 84 82 100 94 C 116 82 140 80 160 92 L 160 124 C 140 112 116 114 100 126 C 84 114 60 112 40 124 Z" stroke="${c}" stroke-width="3.5" fill="none" stroke-linejoin="round"/><line x1="100" y1="94" x2="100" y2="126" stroke="${c}" stroke-width="3"/></svg>`;

/* ═══ DURUM ═══ */
const $=s=>document.querySelector(s);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let state={view:'library',story:null,page:0};
let saved={},prog={},showTr=false,turnBusy=false;
try{saved=JSON.parse(localStorage.getItem('pb.words')||'{}')}catch(e){}
try{prog=JSON.parse(localStorage.getItem('pb.prog')||'{}')}catch(e){}
try{showTr=localStorage.getItem('pb.tr')==='1'}catch(e){}
let wordFilter='all',wordQuery='',quiz=null;
const save=()=>{try{localStorage.setItem('pb.words',JSON.stringify(saved));localStorage.setItem('pb.prog',JSON.stringify(prog));localStorage.setItem('pb.tr',showTr?'1':'0')}catch(e){}};
STORIES.forEach(s=>s.scenes.forEach(c=>c.lines=c.l.split(';').map(p=>p.split('|'))));

function lineHTML(bg){
  const raw=bg.split(/(\s+)/);
  const T=raw.map(t=>{
    if(t===''||/^\s+$/.test(t))return{type:'ws',t};
    const m=t.match(/^([^\p{L}]*)([\p{L}][\p{L}'’-]*)([\s\S]*)$/u);
    if(m&&m[2]&&/[\u0400-\u04FF]/.test(m[2]))return{type:'w',pre:m[1],w:m[2],post:m[3],norm:m[2].toLowerCase()};
    return{type:'p',t};
  });
  let out='',i=0;
  while(i<T.length){const t=T[i];
    if(t.type==='w'){
      let k=t.norm,txt=t.pre+t.w+t.post,adv=1;
      if(T[i+1]&&T[i+1].type==='ws'&&T[i+2]&&T[i+2].type==='w'){
        const k2=t.norm+' '+T[i+2].norm;
        if(D[k2]){k=k2;txt=t.pre+t.w+T[i+1].t+T[i+2].w+T[i+2].post;adv=3}
      }
      out+=D[k]?`<button class="w" data-k="${k}">${esc(txt)}</button>`:esc(txt);
      i+=adv;continue;
    }
    out+=esc(t.t);i++;
  }
  return out;
}
const icoTr=`<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h11M9.5 4v3M12.5 7c-1 5-4.5 8.5-8.5 10M7 12.5c1.5 3 4 5.5 7 6.5"/><path d="M14 20l4-9 4 9M15.3 17h5.4"/></svg>`;
const icoL=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const icoR=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>`;
const icoEye=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>`;
const icoBack=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>`;

function renderTop(v){document.querySelectorAll('#top nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function renderLibrary(){
  state.view='library';renderTop('library');
  const rows=STORIES.map((s,i)=>{
    const p=Math.min(prog[s.id]||0,8),dots=Array.from({length:8},(_,j)=>`<i class="${j<p?'on':''}"></i>`).join('');
    return `<article class="toc-row" data-s="${s.id}"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${s.bg}</h3><div class="ttr">${s.tr}</div><div class="tags">${s.tags}</div></div><div class="toc-side"><div class="dots">${dots}</div><small>${p}/8 sayfa</small></div></article>`}).join('');
  $('#view').innerHTML=`<section class="lib"><aside class="cover"><div class="kick">БЪЛГАРСКИ РАЗКАЗИ · A1</div><h1>ПЪРВИ<br>СТЪПКИ</h1><div class="sub">İLK ADIMLAR</div><div class="rule"><i></i></div>${EMBLEM()}<p>Türkçe bilenler için hikâyeli Bulgarca. Günlük hayatta en çok ihtiyaç duyulan kelimeler, tekrar tekrar karşılaşacağın sahnelerle.</p><div class="foot">КНИГА I · 10 РАЗКАЗА · 490 ИЗРЕЧЕНИЯ</div></aside><div class="sheet toc"><h2>Съдържание</h2><div class="htr">İçindekiler</div><p class="lede">Her hikâye bağımsızdır ve kendi kelime dünyasını öğretir. Okurken bir kelimeye tıkla — anlamı sayfanın dibindeki dipnota düşer ve kelime defterine kendiliğinden yazılır.</p>${rows}<div class="toc-note">Ok tuşlarıyla sayfa çevirebilirsin · Sağ üstteki düğmeyle tüm cümle çevirilerini açıp kapatabilirsin.</div></div></section>`;
  document.querySelectorAll('.toc-row').forEach(r=>r.addEventListener('click',()=>openStory(r.dataset.s)));
}
function openStory(id){state.story=STORIES.find(s=>s.id===id);state.page=0;renderStory()}
function pageHTML(s,p){
  const pages=s.scenes.length+1;
  if(p===pages-1){
    const used=Object.keys(saved).length;
    const idx=STORIES.indexOf(s),next=STORIES[idx+1];
    const flist=s.focus.map(k=>`<div class="f-row"><b>${cap(k)}</b><div class="lead"></div><span>${D[k]?D[k][0]:''}</span></div>`).join('');
    return `<div class="page pl end-pl"><h2>КРАЙ</h2><div class="sub">Son</div><div class="rule" style="width:120px"><i></i></div>${EMBLEM()}<p style="font-size:12px;letter-spacing:.2em;opacity:.65;margin-top:18px">${s.bg.toUpperCase()}</p></div><div class="page pr end-pr"><span class="kick">Hikâye ${idx+1} · Bitti</span><h3 style="margin-top:10px">Браво!</h3><p class="stats">Bu hikâyeyi okudun. Defterinde şimdi ${used} kelime birikti.</p><div class="focus-list">${flist}</div><div class="end-btns"><button class="bn" id="bn-toc">${icoBack} İçindekiler</button>${next?`<button class="bn solid" id="bn-next">Sıradaki: ${next.tr} ${icoR}</button>`:`<button class="bn solid" id="bn-words">Kelime Defteri ${icoR}</button>`}</div></div>`;
  }
  const sc=s.scenes[p];
  return `<div class="page pl"><div class="pf"></div><div class="p-illo"><div class="illo-box"><svg viewBox="0 0 640 460">${ILLO[s.id+'-'+p]()}</svg></div><div class="illo-cap">Сцена ${p+1} · Sahne ${p+1}</div></div></div><div class="page pr"><div class="pf"></div><div class="p-text"><span class="kick">Hikâye ${STORIES.indexOf(s)+1} · Sayfa ${p+1}/${pages}</span>${p===0?`<div class="s-title">${s.bg}</div><div class="s-sub">${s.tr}</div>`:''}<div class="lines">${sc.lines.map(l=>`<p class="line">${lineHTML(l[0])}<button class="trb" title="Çeviriyi göster/gizle">${icoTr}</button><span class="tr">${l[1]}</span></p>`).join('')}</div><div class="fn-area"><span class="fn-label">Дипнот · Dipnot</span></div></div></div>`;
}
function renderStory(){
  state.view='story';renderTop('story');document.body.classList.toggle('trall',showTr);
  const s=state.story,pages=s.scenes.length+1,p=state.page;
  $('#view').innerHTML=`<div class="story-top"><button class="back" id="st-back">${icoBack} Съдържание · İçindekiler</button><button class="tr-sw ${showTr?'on':''}" id="tr-sw">${icoEye} Çeviriler ${showTr?'açık':'kapalı'}</button></div><div class="book" id="book">${pageHTML(s,p)}</div><div class="book-nav"><button class="bn" id="bn-prev" ${p===0?'disabled':''}>${icoL} НАЗАД</button><button class="bn ghost" id="bn-toc2">Съдържание</button><button class="bn" id="bn-next2" ${p===pages-1?'disabled':''}>НАПРЕД ${icoR}</button></div><div class="hint">← → ok tuşlarıyla da çevirebilirsin · kelimelere tıkla</div>`;
  $('#st-back').onclick=renderLibrary;
  $('#bn-toc2').onclick=renderLibrary;
  $('#tr-sw').onclick=()=>{showTr=!showTr;save();document.body.classList.toggle('trall',showTr);const b=$('#tr-sw');b.classList.toggle('on',showTr);b.innerHTML=`${icoEye} Çeviriler ${showTr?'açık':'kapalı'}`};
  $('#bn-prev').onclick=()=>turn(-1);
  $('#bn-next2').onclick=()=>turn(1);
  bindPage();
}
function turn(dir){
  if(turnBusy)return;
  const s=state.story,pages=s.scenes.length+1,np=state.page+dir;
  if(np<0||np>=pages)return;
  turnBusy=true;
  const book=$('#book');
  book.classList.add('leaf-out');
  prog[s.id]=Math.max(prog[s.id]||0,np+1);save();
  setTimeout(()=>{
    state.page=np;
    book.innerHTML=pageHTML(s,np);
    book.classList.remove('leaf-out');book.classList.add('leaf-in');
    $('#bn-prev').disabled=np===0;$('#bn-next2').disabled=np===pages-1;
    bindPage();
    setTimeout(()=>{book.classList.remove('leaf-in');turnBusy=false},380);
  },290);
}
function bindPage(){
  const s=state.story;
  document.querySelectorAll('#book .trb').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();b.closest('.line').classList.toggle('open')}));
  document.querySelectorAll('#book .w').forEach(w=>w.addEventListener('click',()=>{
    const k=w.dataset.k,v=D[k];if(!v)return;
    const area=$('#book .fn-area');if(!area)return;
    area.querySelectorAll('.fn').forEach(n=>n.classList.remove('new'));
    const isNew=!saved[k];
    saved[k]=saved[k]||{n:0};saved[k].n++;saved[k].t=Date.now();save();
    const chip=document.createElement('span');chip.className='fn new';
    chip.innerHTML=`<b>${esc(cap(k))}</b><em>${esc(v[0])}</em><span class="add">${isNew?'yeni · deftere eklendi':'tekrar ×'+saved[k].n}</span>`;
    area.appendChild(chip);
    w.classList.add('hit');setTimeout(()=>w.classList.remove('hit'),900);
  }));
  const bt=$('#bn-toc');if(bt)bt.onclick=renderLibrary;
  const bn=$('#bn-next');if(bn)bn.onclick=()=>openStory(STORIES[STORIES.indexOf(s)+1].id);
  const bw=$('#bn-words');if(bw)bw.onclick=renderWords;
}
function renderWords(){
  state.view='words';renderTop('words');
  const nBook=Object.keys(saved).filter(k=>D[k]).length;
  const cats=[...new Set(Object.keys(saved).filter(k=>D[k]).map(k=>D[k][1]))];
  if(wordFilter!=='all'&&!cats.includes(wordFilter))wordFilter='all';
  $('#view').innerHTML=`<section class="sheet words"><h2>Речник</h2><div class="cnt">Kelime Defteri · <b id="w-count">${nBook}</b> kelime</div><p class="lede">Hikâyeleri okurken tıkladığın her kelime burada birikir. En son tıkladıkların üstte görünür.</p><div class="w-tools"><input class="search" id="w-search" placeholder="Ara: bulgarca ya da türkçe…" value="${esc(wordQuery)}"><div class="chips" id="w-chips"><button class="chip ${wordFilter==='all'?'on':''}" data-c="all">tümü</button>${cats.map(c=>`<button class="chip ${wordFilter===c?'on':''}" data-c="${c}">${CATS[c]||c}</button>`).join('')}</div><button class="bn solid" id="w-quiz" ${nBook<4?'disabled':''}>Alıştırma ${icoR}</button></div><div class="w-list" id="w-list"></div></section>`;
  $('#w-search').addEventListener('input',e=>{wordQuery=e.target.value;wordsRefresh()});
  document.querySelectorAll('#w-chips .chip').forEach(ch=>ch.addEventListener('click',()=>{wordFilter=ch.dataset.c;document.querySelectorAll('#w-chips .chip').forEach(x=>x.classList.toggle('on',x.dataset.c===wordFilter));wordsRefresh()}));
  $('#w-quiz').onclick=()=>{buildQuiz(Object.keys(saved).filter(k=>D[k]),'book');renderQuiz()};
  wordsRefresh();
}
function wordsRefresh(){
  const list=$('#w-list');if(!list)return;
  let keys=Object.keys(saved).filter(k=>D[k]);
  const total=keys.length;
  if(wordFilter!=='all')keys=keys.filter(k=>D[k][1]===wordFilter);
  if(wordQuery){const q=wordQuery.toLowerCase();keys=keys.filter(k=>k.includes(q)||D[k][0].toLowerCase().includes(q))}
  keys.sort((a,b)=>(saved[b].t||0)-(saved[a].t||0));
  const cnt=$('#w-count');if(cnt)cnt.textContent=total;
  if(!total){list.innerHTML=`<div class="empty">Defterin henüz boş.<br>Hikâyeleri aç ve kelimelere tıkla — gördüğün her kelime buraya düşecek.</div>`;return}
  if(!keys.length){list.innerHTML=`<div class="empty">Bu süzgeçte kelime yok.</div>`;return}
  list.innerHTML=keys.map(k=>`<div class="w-row"><span class="bg">${esc(cap(k))}</span><div class="lead"></div><span class="trm">${esc(D[k][0])}</span><span class="cat">${CATS[D[k][1]]||D[k][1]}</span><button class="del" data-k="${k}" title="Defterden çıkar">×</button></div>`).join('');
  list.querySelectorAll('.del').forEach(d=>d.addEventListener('click',()=>{delete saved[d.dataset.k];save();wordsRefresh()}));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildQuiz(pool,source){
  const words=shuffle(pool.filter(k=>D[k]).slice());
  const opts=[],correct=[];
  const meanings=[...new Set(Object.keys(D).filter(k=>D[k][1]!=='öz').map(k=>D[k][0]))];
  words.forEach(k=>{const m=D[k][0];const pick=shuffle(meanings.filter(x=>x!==m)).slice(0,3);const four=shuffle([m,...pick]);opts.push(four);correct.push(four.indexOf(m))});
  quiz={pool:words,opts,correct,i:0,score:0,answered:false,done:false,source};
}
function renderQuiz(){
  state.view='quiz';renderTop('quiz');
  const nBook=Object.keys(saved).filter(k=>D[k]).length;
  if(!quiz){
    $('#view').innerHTML=`<div class="q-wrap"><div class="sheet q-card"><span class="kick">Тест · Alıştırma</span><div class="s-title" style="margin-top:12px">Kelimelerini yokla</div><p class="q-msg">Dörtlü seçmeli sorular: Bulgarca kelimeyi okur, doğru Türkçe anlamı seçersin.<br>Klavyeden 1–4 tuşlarıyla da cevap verebilirsin.</p><div class="end-btns" style="justify-content:center"><button class="bn solid" id="q-book" ${nBook<4?'disabled':''}>Defterim (${nBook})</button><button class="bn" id="q-all">Tüm sözlük</button></div></div></div>`;
    $('#q-book').onclick=()=>{buildQuiz(Object.keys(saved).filter(k=>D[k]),'book');renderQuiz()};
    $('#q-all').onclick=()=>{buildQuiz(Object.keys(D).filter(k=>D[k][1]!=='öz'),'all');renderQuiz()};
    return;
  }
  if(quiz.done){
    const pct=Math.round(quiz.score/quiz.pool.length*100);
    const msg=pct===100?'Много добре! Kusursuz.':pct>=70?'Добра работа! Sağlam bilgi.':'Не е лошо! Hikâyede tekrar karşılaşacaksın.';
    $('#view').innerHTML=`<div class="q-wrap"><div class="sheet q-card"><span class="kick">Тест · Bitti</span><div class="q-score">${quiz.score}<span> / ${quiz.pool.length}</span></div><p class="q-msg">${msg}</p><div class="end-btns" style="justify-content:center"><button class="bn" id="q-home">${icoBack} İçindekiler</button><button class="bn solid" id="q-again">Tekrar ${icoR}</button></div></div></div>`;
    $('#q-home').onclick=renderLibrary;
    $('#q-again').onclick=()=>{if(quiz.source==='book'){const p=Object.keys(saved).filter(k=>D[k]);if(p.length>=4)buildQuiz(p,'book');else quiz=null}else buildQuiz(Object.keys(D).filter(k=>D[k][1]!=='öz'),'all');renderQuiz()};
    return;
  }
  const total=quiz.pool.length,k=quiz.pool[quiz.i],v=D[k],four=quiz.opts[quiz.i];
  $('#view').innerHTML=`<div class="q-wrap"><div class="sheet q-card"><div class="q-head"><span>Съпрос · Soru ${quiz.i+1}/${total}</span><span>Skor ${quiz.score}</span></div><div class="q-word">${esc(cap(k))}</div><div class="q-cue">Bulgarca ${CATS[v[1]]||'kelime'} — Türkçesi nedir?</div><div class="q-opts">${four.map((o,idx)=>`<button class="q-opt" data-i="${idx}"><span class="q-key">${idx+1}</span>${esc(o)}</button>`).join('')}</div><div class="q-next" id="q-next"></div></div></div>`;
  document.querySelectorAll('.q-opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.i)));
}
function answer(i){
  if(!quiz||quiz.answered)return;
  quiz.answered=true;
  const ci=quiz.correct[quiz.i];
  document.querySelectorAll('.q-opt').forEach((b,idx)=>{b.disabled=true;if(idx===ci)b.classList.add('ok');else if(idx===i)b.classList.add('bad')});
  if(i===ci)quiz.score++;
  const qh=document.querySelector('.q-head span:last-child');if(qh)qh.textContent='Skor '+quiz.score;
  $('#q-next').innerHTML=`<button class="bn solid" id="q-go">${quiz.i+1<quiz.pool.length?'СЛЕДВАЩ · Sonraki':'КРАЙ · Bitir'} ${icoR}</button>`;
  $('#q-go').onclick=()=>{quiz.i++;quiz.answered=false;if(quiz.i>=quiz.pool.length)quiz.done=true;renderQuiz()};
}
document.querySelectorAll('#top nav button').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.v;
  if(v==='library')renderLibrary();else if(v==='words')renderWords();else if(v==='quiz')renderQuiz();
}));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(state.view==='story'){if(e.key==='ArrowRight')turn(1);else if(e.key==='ArrowLeft')turn(-1)}
  else if(state.view==='quiz'&&quiz&&!quiz.done){
    if(!quiz.answered&&['1','2','3','4'].includes(e.key)){const b=document.querySelectorAll('.q-opt')[+e.key-1];if(b)b.click()}
    else if(quiz.answered&&(e.key==='Enter'||e.key===' ')){const g=$('#q-go');if(g){e.preventDefault();g.click()}}
  }
});
renderLibrary();
</script>
